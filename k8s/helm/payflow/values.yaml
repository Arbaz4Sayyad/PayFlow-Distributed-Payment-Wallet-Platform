# Default values for payflow Helm chart

global:
  environment: production
  imageRegistry: "payflow"
  imagePullPolicy: IfNotPresent
  imageTag: "1.0.0"

ingress:
  enabled: true
  className: "nginx"
  host: "api.payflow.com"
  tls:
    enabled: true
    secretName: "payflow-tls-cert"

config:
  dbHost: "postgres-service.payflow.svc.cluster.local"
  dbPort: 5432
  redisHost: "redis-service.payflow.svc.cluster.local"
  redisPort: 6379
  kafkaBootstrapServers: "kafka-service.payflow.svc.cluster.local:9092"

secrets:
  dbUser: "postgres"
  dbPassword: "postgres_payflow_secure_2026"
  redisPassword: "redis_payflow_secure_2026"
  jwtSecret: "payflowSuperSecretProductionKeyMustBeAtLeast256BitsLongForHmacSha256!"

services:
  apiGateway:
    enabled: true
    replicaCount: 3
    port: 8080
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1024Mi"
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 20
      targetCPUUtilizationPercentage: 65

  paymentService:
    enabled: true
    replicaCount: 3
    port: 8083
    dbName: "payment_db"
    resources:
      requests:
        cpu: "500m"
        memory: "1024Mi"
      limits:
        cpu: "2000m"
        memory: "2048Mi"
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 15
      targetCPUUtilizationPercentage: 70

  walletService:
    enabled: true
    replicaCount: 3
    port: 8082
    dbName: "wallet_db"
    resources:
      requests:
        cpu: "500m"
        memory: "1024Mi"
      limits:
        cpu: "2000m"
        memory: "2048Mi"
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 15
      targetCPUUtilizationPercentage: 70

  userService:
    enabled: true
    replicaCount: 2
    port: 8081
    dbName: "user_db"
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1024Mi"

  ledgerService:
    enabled: true
    replicaCount: 2
    port: 8084
    dbName: "ledger_db"
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1024Mi"

  merchantService:
    enabled: true
    replicaCount: 2
    port: 8085
    dbName: "merchant_db"
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1024Mi"

  fraudService:
    enabled: true
    replicaCount: 2
    port: 8086
    dbName: "fraud_db"
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1024Mi"

  notificationService:
    enabled: true
    replicaCount: 2
    port: 8087
    dbName: "notification_db"
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1024Mi"
