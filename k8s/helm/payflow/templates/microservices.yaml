{{- $fullName := include "payflow.fullname" . -}}
{{- $labels := include "payflow.labels" . -}}
{{- $imageRegistry := .Values.global.imageRegistry -}}
{{- $imageTag := .Values.global.imageTag -}}
{{- $imagePullPolicy := .Values.global.imagePullPolicy -}}

{{- range $serviceKey, $serviceVal := .Values.services -}}
{{- if $serviceVal.enabled -}}
{{- $serviceKebab := $serviceKey | kebabcase -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-{{ $serviceKebab }}
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceKebab }}
spec:
  {{- if not $serviceVal.autoscaling.enabled }}
  replicas: {{ $serviceVal.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $fullName }}-{{ $serviceKebab }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $fullName }}-{{ $serviceKebab }}
        app.kubernetes.io/component: {{ $serviceKebab }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: {{ $serviceVal.port | quote }}
    spec:
      containers:
        - name: {{ $serviceKebab }}
          image: "{{ $imageRegistry }}/{{ $serviceKebab }}:{{ $imageTag }}"
          imagePullPolicy: {{ $imagePullPolicy }}
          ports:
            - containerPort: {{ $serviceVal.port }}
              name: http
          {{- if $serviceVal.dbName }}
          env:
            - name: {{ printf "%s_DB_NAME" ($serviceKebab | upper | replace "-" "_") }}
              value: {{ $serviceVal.dbName | quote }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ $fullName }}-config
            - secretRef:
                name: {{ $fullName }}-secrets
          resources:
            {{- toYaml $serviceVal.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /actuator/health
              port: {{ $serviceVal.port }}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ $serviceVal.port }}
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ $serviceVal.port }}
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-{{ $serviceKebab }}
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceKebab }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $serviceVal.port }}
      targetPort: {{ $serviceVal.port }}
      name: http
  selector:
    app.kubernetes.io/name: {{ $fullName }}-{{ $serviceKebab }}

{{- if $serviceVal.autoscaling }}
{{- if $serviceVal.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullName }}-{{ $serviceKebab }}-hpa
  labels:
    {{- $labels | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $fullName }}-{{ $serviceKebab }}
  minReplicas: {{ $serviceVal.autoscaling.minReplicas }}
  maxReplicas: {{ $serviceVal.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $serviceVal.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}

{{- end }}
{{- end }}
