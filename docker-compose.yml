# ============================================================
# PayFlow — Production Docker Compose
#
# Architecture:
#   Infrastructure: postgres (1 shared instance, 7 databases),
#                   redis, kafka (+ zookeeper)
#   Services:       api-gateway, user, wallet, payment, ledger,
#                   merchant, fraud, notification
#   Observability:  prometheus, grafana
#
# Usage:
#   Start all:      docker compose --env-file .env up -d
#   Tail logs:      docker compose logs -f payment-service
#   Stop & clean:   docker compose down -v
#   Rebuild one:    docker compose up -d --build payment-service
# ============================================================

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - payflow-net
  env_file:
    - .env
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "5"

x-java-service: &java-service
  <<: *service-defaults
  build:
    context: .
    dockerfile: Dockerfile
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:

  # ─────────────── Infrastructure ───────────────

  postgres:
    <<: *service-defaults
    image: postgres:16-alpine
    container_name: payflow-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: >-
        user_db,wallet_db,payment_db,ledger_db,merchant_db,fraud_db,notification_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    container_name: payflow-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  zookeeper:
    <<: *service-defaults
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: payflow-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=*"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep Mode"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    <<: *service-defaults
    image: confluentinc/cp-kafka:7.6.0
    container_name: payflow-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "29092:29092"      # External host access
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ─────────────── Observability ───────────────

  prometheus:
    <<: *service-defaults
    image: prom/prometheus:v2.51.0
    container_name: payflow-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    <<: *service-defaults
    image: grafana/grafana:10.4.0
    container_name: payflow-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-payflow123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─────────────── Application Services ───────────────

  api-gateway:
    <<: *java-service
    container_name: payflow-api-gateway
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
        SERVICE_PORT: "8080"
    environment:
      SERVER_PORT: 8080
      USER_SERVICE_URI: http://user-service:8081
      WALLET_SERVICE_URI: http://wallet-service:8082
      PAYMENT_SERVICE_URI: http://payment-service:8083
      LEDGER_SERVICE_URI: http://ledger-service:8084
      MERCHANT_SERVICE_URI: http://merchant-service:8085
      FRAUD_SERVICE_URI: http://fraud-service:8086
      NOTIFICATION_SERVICE_URI: http://notification-service:8087
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
      wallet-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  user-service:
    <<: *java-service
    container_name: payflow-user-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: user-service
        SERVICE_PORT: "8081"
    environment:
      SERVER_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      USER_DB_NAME: user_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: production
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  wallet-service:
    <<: *java-service
    container_name: payflow-wallet-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: wallet-service
        SERVICE_PORT: "8082"
    environment:
      SERVER_PORT: 8082
      DB_HOST: postgres
      DB_PORT: 5432
      WALLET_DB_NAME: wallet_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  payment-service:
    <<: *java-service
    container_name: payflow-payment-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: payment-service
        SERVICE_PORT: "8083"
    environment:
      SERVER_PORT: 8083
      DB_HOST: postgres
      DB_PORT: 5432
      PAYMENT_DB_NAME: payment_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  ledger-service:
    <<: *java-service
    container_name: payflow-ledger-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: ledger-service
        SERVICE_PORT: "8084"
    environment:
      SERVER_PORT: 8084
      DB_HOST: postgres
      DB_PORT: 5432
      LEDGER_DB_NAME: ledger_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: production
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8084/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  merchant-service:
    <<: *java-service
    container_name: payflow-merchant-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: merchant-service
        SERVICE_PORT: "8085"
    environment:
      SERVER_PORT: 8085
      DB_HOST: postgres
      DB_PORT: 5432
      MERCHANT_DB_NAME: merchant_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: production
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  fraud-service:
    <<: *java-service
    container_name: payflow-fraud-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: fraud-service
        SERVICE_PORT: "8086"
    environment:
      SERVER_PORT: 8086
      DB_HOST: postgres
      DB_PORT: 5432
      FRAUD_DB_NAME: fraud_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8086/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  notification-service:
    <<: *java-service
    container_name: payflow-notification-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: notification-service
        SERVICE_PORT: "8087"
    environment:
      SERVER_PORT: 8087
      DB_HOST: postgres
      DB_PORT: 5432
      NOTIFICATION_DB_NAME: notification_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: production
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8087:8087"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8087/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

# ─────────────── Networks ───────────────
networks:
  payflow-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ─────────────── Named Volumes ───────────────
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  kafka-data:
    driver: local
  zookeeper-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
