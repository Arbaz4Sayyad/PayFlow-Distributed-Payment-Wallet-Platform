services:
  # PayFlow Developer Portal & Interactive API Hub (Static Site)
  - type: web
    name: payflow-developer-portal
    runtime: static
    buildCommand: ""
    staticPublishPath: ./docs/developer-portal
    pullRequestPreviewsEnabled: true

  # API Gateway (Public Web Service)
  - type: web
    name: payflow-api-gateway
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVICE_NAME
        value: api-gateway
      - key: SERVICE_PORT
        value: "8080"
      - key: SERVER_PORT
        value: "8080"
      - key: USER_SERVICE_URI
        value: https://payflow-user-service.onrender.com
      - key: WALLET_SERVICE_URI
        value: https://payflow-wallet-service-ued6.onrender.com
      - key: PAYMENT_SERVICE_URI
        value: https://payflow-payment-service-j1a6.onrender.com
      - key: LEDGER_SERVICE_URI
        value: https://payflow-ledger-service.onrender.com
      - key: MERCHANT_SERVICE_URI
        value: https://payflow-merchant-service-dv6u.onrender.com
      - key: FRAUD_SERVICE_URI
        value: https://payflow-fraud-service-j4ew.onrender.com
      - key: NOTIFICATION_SERVICE_URI
        value: https://payflow-notification-service-x4r4.onrender.com
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL
        value: "true"

  # User Service
  - type: web
    name: payflow-user-service
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVICE_NAME
        value: user-service
      - key: SERVICE_PORT
        value: "8081"
      - key: SERVER_PORT
        value: "8081"
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false

  # Wallet Service
  - type: web
    name: payflow-wallet-service
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVICE_NAME
        value: wallet-service
      - key: SERVICE_PORT
        value: "8082"
      - key: SERVER_PORT
        value: "8082"
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL
        value: "true"
      - key: JWT_SECRET
        sync: false

  # Payment Service
  - type: web
    name: payflow-payment-service
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVICE_NAME
        value: payment-service
      - key: SERVICE_PORT
        value: "8083"
      - key: SERVER_PORT
        value: "8083"
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL
        value: "true"
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: JWT_SECRET
